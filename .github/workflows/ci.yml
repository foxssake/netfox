name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
      - name: Lint
        run: sh/lint.sh
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [4.2.2, 4.3.0, 4.4.0, 4.5.0, 4.6.0, 4.7.0]
    steps:
      - name: Checkout 
        uses: actions/checkout@v2
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ matrix.version }}
          use-dotnet: false
          include-templates: false
      - name: Verify setup
        run: godot --version
      - name: Run tests
        run: sh/test.sh
